name: Clarify drafts - Windows candidate pipeline

# Manual workflow for this public build/test repository. It proves the clarify-draft autosave on real Windows in
# five bounded jobs and publishes nothing:
#
#   launcher      windows-2025: the shipped isolating launcher's self-test (Windows PowerShell 5.1 and PowerShell 7)
#   native        windows-2025: Desktop built from source; every clarify-draft Python test; the Desktop identity,
#                 user-data and deep-link unit tests; every native Playwright spec
#                 (apps/desktop/e2e/clarify-drafts-native*.spec.ts and batch-clarify.spec.ts) but the one that is
#                 POSIX-only in practice, one worker, no retries
#   compute-host  ubuntu-24.04: that one spec (clarify-drafts-native-compute-host.spec.ts, turn isolation's child
#                 process) under Xvfb, one worker, no retries, no skips, and the compute-host Python tests whose
#                 real-child cases are POSIX-only (skipped on Windows). Linux evidence, never Windows evidence
#   package       windows-2025, only when all three passed: the unsigned one-commit BUNDLED candidate: the Desktop app
#                 plus the Python runtime, dependencies and this commit's source it starts, zipped with the launcher
#                 and a MANIFEST.json. electron-builder runs with --publish never; no signing credential exists here
#   accept        windows-2025: downloads the uploaded zip, checks its digest against the build job's and every file
#                 against MANIFEST.json, extracts it, and runs the executable inside it twice: through the shipped
#                 Start-HermesClarifyCandidate.cmd (clarify-drafts-packaged.spec.ts, the full scenario in a sandbox)
#                 and started directly, as a double-click would (clarify-drafts-packaged-direct.spec.ts)
#
# Evidence stays private for 7 days: clarify-windows-* (native), clarify-linux-* (compute-host), clarify-candidate-*
# (the zip, MANIFEST.json, SHA256SUMS.txt), clarify-package-evidence-*, clarify-acceptance-*. A green run on a clean
# GitHub runner is not proof for any other machine; the acceptance verdict says exactly what it covers.

on:
  workflow_dispatch:
    inputs:
      stage:
        description: >-
          all: native acceptance, then, only if it passed, the packaged candidate and its acceptance.
          native: the native acceptance (Windows native, Linux compute-host) and the launcher self-test only.
        type: choice
        options:
          - all
          - native
        default: all

permissions:
  contents: read

concurrency:
  group: clarify-windows-${{ github.ref }}
  # Queue a second dispatch for the same branch instead of killing an in-flight
  # evidence run; GitHub keeps at most one running and one pending.
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  # No provider credential may reach a test; the fixtures also strip them.
  OPENROUTER_API_KEY: ''
  OPENAI_API_KEY: ''
  NOUS_API_KEY: ''
  ANTHROPIC_API_KEY: ''
  PYTHONUTF8: '1'

jobs:
  launcher:
    name: Candidate launcher self-test (windows-2025 x64)
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The shell Start-HermesClarifyCandidate.cmd uses. The self-test lays the shipped launcher beside a fake
      # package inside a temp directory it owns and never touches a real Hermes location.
      - name: Launcher self-test (Windows PowerShell 5.1)
        shell: powershell
        run: ./scripts/clarify_ci/Test-CandidateLauncher.ps1

      - name: Launcher self-test (PowerShell 7)
        shell: pwsh
        run: ./scripts/clarify_ci/Test-CandidateLauncher.ps1

  native:
    name: Desktop build + clarify drafts native E2E (windows-2025 x64)
    runs-on: windows-2025
    timeout-minutes: 60
    env:
      # Specs of this gate that do not follow the clarify-drafts-native*.spec.ts naming, by file name under
      # apps/desktop/e2e. They run with the glob's specs, are guarded like them, and are proven by the Playwright JSON.
      CLARIFY_EXTRA_SPECS: batch-clarify.spec.ts
      # Specs the glob finds that this job deliberately does not run, because the compute-host job does. Turn
      # isolation's compute-host child is POSIX-only in practice: tui_gateway/host_supervisor.py probes liveness with
      # os.kill(pid, 0) (:109, a CTRL_C_EVENT on Windows), escalates with signal.SIGKILL (:517, which Windows does not
      # have) and finds its child only through /proc or `ps` (:131, :134), and the product's own real-child tests are
      # platforms('linux'). An explicit, named exclusion that evidence.py checks (a name the glob no longer finds is
      # an error), never a silent glob miss.
      CLARIFY_EXCLUDED_SPECS: clarify-drafts-native-compute-host.spec.ts
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Name the evidence root
        run: |
          # Mixed form (D:/a/_temp) reads the same to Git Bash, Python and Node.
          temp="$RUNNER_TEMP"
          if command -v cygpath >/dev/null; then temp="$(cygpath -m "$RUNNER_TEMP")"; fi
          echo "CLARIFY_EVIDENCE=$temp/clarify-evidence" >> "$GITHUB_ENV"
          echo "CLARIFY_ARTIFACT=$temp/clarify-artifact" >> "$GITHUB_ENV"

      - name: Prepare locked Python/Node toolchain and test interpreter
        id: pm
        uses: ./.github/actions/setup-pm
        with:
          toolchain: all
          extras: '[]'
          test-environment: 'true'
          archive-inputs: 'false'

      - name: Record source and run metadata
        if: always()
        env:
          PM_PYTHON: ${{ steps.pm.outputs.python-version }}
          PM_UV: ${{ steps.pm.outputs.uv-version }}
          PM_NODE: ${{ steps.pm.outputs.node-version }}
          PM_NPM: ${{ steps.pm.outputs.npm-version }}
          PM_TARGET: ${{ steps.pm.outputs.target }}
        run: |
          python -S scripts/clarify_ci/evidence.py metadata --out "$CLARIFY_EVIDENCE/metadata/run.json" \
            --set "pm.python=$PM_PYTHON" --set "pm.uv=$PM_UV" --set "pm.node=$PM_NODE" \
            --set "pm.npm=$PM_NPM" --set "pm.target=$PM_TARGET"

      - name: Record runner facts
        if: always()
        continue-on-error: true
        shell: pwsh
        run: ./scripts/clarify_ci/Get-RunnerFacts.ps1 -Out "$env:CLARIFY_EVIDENCE/metadata/runner-facts.json"

      # Full npm ci (not --ignore-scripts): electron's postinstall downloads the
      # binary the specs launch. Only this dependency install is retried.
      - name: Install npm workspaces (npm ci)
        id: npm
        uses: ./.github/actions/retry
        with:
          command: npm ci

      - name: Build the Desktop app from source
        id: build
        working-directory: apps/desktop
        timeout-minutes: 15
        run: npm run build

      # The listed files are the baseline gate. select_tests.py adds every other tests/**/test_*clarify*draft*.py,
      # so a draft test a later commit introduces cannot be left out of the gate by forgetting to list it.
      - name: Clarify draft and contract Python tests
        id: python
        if: always() && steps.pm.outcome == 'success'
        timeout-minutes: 25
        env:
          HERMES_TEST_FILE_RETRIES: '0'
        run: |
          set -euo pipefail
          mkdir -p "$CLARIFY_EVIDENCE/python"
          # A failed selection must fail the step (an empty list would run the whole suite), and a Windows
          # interpreter's CRLF must not end up inside the file names.
          python -S scripts/clarify_ci/select_tests.py \
            tests/gateway/test_clarify_drafts_owner.py \
            tests/tools/test_clarify_drafts_store.py \
            tests/tools/test_clarify_tool_drafts.py \
            tests/tools/test_clarify_draft_versions.py \
            tests/tui_gateway/test_clarify_drafts.py \
            tests/tui_gateway/test_clarify_drafts_session_delete.py \
            tests/tools/test_clarify_tool.py \
            tests/tools/test_clarify_gateway.py \
            tests/gateway/test_clarify_card_retire_on_timeout.py \
            tests/gateway/test_clarify_lock_owner.py \
            tests/gateway/test_clarify_lock_keeps_locked_answers.py \
            tests/gateway/test_clarify_batch_settlement_parity.py \
            tests/gateway/test_canonical_wire_contract.py \
            tests/tui_gateway/test_protocol.py \
            tests/tui_gateway/test_session_delete_rpc.py \
            tests/tui_gateway/contracts/test_generated.py \
            scripts/clarify_ci/test_evidence.py \
            scripts/clarify_ci/test_candidate.py \
            scripts/clarify_ci/test_select_tests.py \
            | tr -d '\r' > "$CLARIFY_EVIDENCE/python/selected-tests.txt"
          mapfile -t tests < "$CLARIFY_EVIDENCE/python/selected-tests.txt"
          test "${#tests[@]}" -gt 0
          echo "running ${#tests[@]} test file(s)"
          scripts/run_tests.sh "${tests[@]}" -q 2>&1 | tee "$CLARIFY_EVIDENCE/python/run_tests.log"

      - name: Generated gateway contracts are current
        id: contracts
        if: always() && steps.pm.outcome == 'success'
        run: |
          set -euo pipefail
          mkdir -p "$CLARIFY_EVIDENCE/python"
          "$HERMES_PYTHON" scripts/gen_gateway_contracts.py --check 2>&1 | tee "$CLARIFY_EVIDENCE/python/contracts.log"

      # The desktop's own contracts for what the packaged candidate relies on: its product identity and user data
      # directory (nothing may create the installed app's default one), the data-path resolution, and the commit
      # build's refusal to register hermes://. The electron project's globalSetup needs no Python on Windows; the PM
      # test interpreter is still handed over explicitly, so it can never resolve or sync one of its own.
      - name: Desktop identity, user-data and deep-link unit tests
        id: desktop-unit
        if: always() && steps.npm.outcome == 'success'
        working-directory: apps/desktop
        timeout-minutes: 10
        env:
          HERMES_PYTHON: ${{ steps.pm.outputs.python-path }}
        run: |
          set -euo pipefail
          mkdir -p "$CLARIFY_EVIDENCE/python"
          npx --no vitest run --project electron \
            electron/product-identity-user-data.test.ts \
            electron/deep-link-protocol.test.ts \
            electron/data-paths.test.ts 2>&1 | tee "$CLARIFY_EVIDENCE/python/desktop-unit.log"

      # Watches beyond the built-in real-install locations (default homes, the installed app's user data and updater
      # cache, the hermes:// registry keys, and the per-OS-user gateway rendezvous USERPROFILE/.local/state/hermes*):
      # Electron's default user data is %APPDATA%\<app name>, so no native run may create any Hermes* folder there.
      - name: Isolation preflight and evidence staging
        id: preflight
        if: always() && steps.build.outcome == 'success'
        run: |
          set -euo pipefail
          selection=()
          for name in $CLARIFY_EXTRA_SPECS; do selection+=(--extra-spec "$name"); done
          for name in $CLARIFY_EXCLUDED_SPECS; do selection+=(--exclude-spec "$name"); done
          python -S scripts/clarify_ci/evidence.py guard "${selection[@]}"
          python -S scripts/clarify_ci/evidence.py sentinels --out "$CLARIFY_EVIDENCE/isolation/before.json" \
            --watch 'APPDATA/Hermes*'
          python -S scripts/clarify_ci/evidence.py stage "$CLARIFY_EVIDENCE/native"

      # Every native spec, one worker, --retries=0: CI=true would otherwise give the root config one hidden retry.
      # The fixture supplies the sandbox HERMES_HOME, home and gateway lock dir, user data (and the --user-data-dir
      # switch), IGNORE_EXISTING, ISOLATED_BACKEND, HERMES_ROOT, unique APP_NAME and SKIP_PROTOCOL_REGISTRATION; the
      # mock server is the only model. The list comes from evidence.py, the same selection `verify` expects, so no
      # spec can be left out of one and not the other.
      - name: Native Windows Playwright - clarify drafts (every native spec but the Linux-only one)
        id: native
        if: always() && steps.preflight.outcome == 'success'
        working-directory: apps/desktop
        timeout-minutes: 35
        env:
          CI: 'true'
          HERMES_DESKTOP_PYTHON: ${{ steps.pm.outputs.python-path }}
          HERMES_E2E_EVIDENCE_DIR: ${{ env.CLARIFY_EVIDENCE }}/native
        run: |
          set -euo pipefail
          "$HERMES_DESKTOP_PYTHON" -S -c "import sys; print('backend interpreter:', sys.executable)"
          selection=()
          for name in $CLARIFY_EXTRA_SPECS; do selection+=(--extra-spec "$name"); done
          for name in $CLARIFY_EXCLUDED_SPECS; do selection+=(--exclude-spec "$name"); done
          mkdir -p "$CLARIFY_EVIDENCE"
          python -S ../../scripts/clarify_ci/evidence.py specs --specs-dir e2e "${selection[@]}" \
            | tr -d '\r' > "$CLARIFY_EVIDENCE/native-specs.txt"
          mapfile -t specs < "$CLARIFY_EVIDENCE/native-specs.txt"
          test "${#specs[@]}" -gt 0
          printf 'native spec: %s\n' "${specs[@]}"
          npx --no playwright test "${specs[@]}" --workers=1 --retries=0

      - name: No real-install location was touched
        id: isolation
        if: always() && steps.preflight.outcome == 'success'
        run: |
          set -euo pipefail
          python -S scripts/clarify_ci/evidence.py sentinels --out "$CLARIFY_EVIDENCE/isolation/after.json" \
            --watch 'APPDATA/Hermes*'
          python -S scripts/clarify_ci/evidence.py isolation \
            --before "$CLARIFY_EVIDENCE/isolation/before.json" --after "$CLARIFY_EVIDENCE/isolation/after.json"

      - name: Verify native evidence is complete
        id: verify
        if: always() && steps.preflight.outcome == 'success'
        run: |
          set -euo pipefail
          selection=()
          for name in $CLARIFY_EXTRA_SPECS; do selection+=(--extra-spec "$name"); done
          for name in $CLARIFY_EXCLUDED_SPECS; do selection+=(--exclude-spec "$name"); done
          python -S scripts/clarify_ci/evidence.py verify "${selection[@]}" \
            --evidence "$CLARIFY_EVIDENCE/native" \
            --results apps/desktop/playwright-report/results.json \
            --out "$CLARIFY_EVIDENCE/native-verdict.json"

      - name: Collect bounded evidence
        if: always()
        run: |
          python -S scripts/clarify_ci/evidence.py collect --dest "$CLARIFY_ARTIFACT" \
            --source "evidence=$CLARIFY_EVIDENCE" \
            --source "playwright-results=apps/desktop/playwright-report/results.json" \
            --source "test-results=apps/desktop/test-results"

      - name: Upload evidence artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: clarify-windows-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.CLARIFY_ARTIFACT }}
          retention-days: 7
          if-no-files-found: error
          include-hidden-files: false

      - name: Evidence gate and summary
        if: always()
        run: |
          python -S scripts/clarify_ci/evidence.py gate \
            --verify "$CLARIFY_EVIDENCE/native-verdict.json" \
            --outcome "setup-pm=${{ steps.pm.outcome }}" \
            --outcome "npm-ci=${{ steps.npm.outcome }}" \
            --outcome "desktop-build=${{ steps.build.outcome }}" \
            --outcome "python-tests=${{ steps.python.outcome }}" \
            --outcome "contracts=${{ steps.contracts.outcome }}" \
            --outcome "desktop-unit=${{ steps.desktop-unit.outcome }}" \
            --outcome "isolation-preflight=${{ steps.preflight.outcome }}" \
            --outcome "native-e2e=${{ steps.native.outcome }}" \
            --outcome "isolation-after=${{ steps.isolation.outcome }}" \
            --outcome "native-evidence=${{ steps.verify.outcome }}"

  compute-host:
    name: Compute-host native E2E (ubuntu-24.04 x64)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # The one spec this job owns: the Windows native job excludes it by name (CLARIFY_EXCLUDED_SPECS).
      COMPUTE_HOST_SPEC: clarify-drafts-native-compute-host.spec.ts
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Name the evidence root
        run: |
          echo "CLARIFY_EVIDENCE=$RUNNER_TEMP/clarify-linux-evidence" >> "$GITHUB_ENV"
          echo "CLARIFY_ARTIFACT=$RUNNER_TEMP/clarify-linux-artifact" >> "$GITHUB_ENV"

      - name: Prepare locked Python/Node toolchain and test interpreter
        id: pm
        uses: ./.github/actions/setup-pm
        with:
          toolchain: all
          extras: '[]'
          test-environment: 'true'
          archive-inputs: 'false'

      - name: Record source and run metadata
        if: always()
        env:
          PM_PYTHON: ${{ steps.pm.outputs.python-version }}
          PM_UV: ${{ steps.pm.outputs.uv-version }}
          PM_NODE: ${{ steps.pm.outputs.node-version }}
          PM_NPM: ${{ steps.pm.outputs.npm-version }}
          PM_TARGET: ${{ steps.pm.outputs.target }}
        run: |
          python3 -S scripts/clarify_ci/evidence.py metadata --out "$CLARIFY_EVIDENCE/metadata/run.json" \
            --set "pm.python=$PM_PYTHON" --set "pm.uv=$PM_UV" --set "pm.node=$PM_NODE" \
            --set "pm.npm=$PM_NPM" --set "pm.target=$PM_TARGET" --set "os=ubuntu-24.04"

      - name: Record runner facts
        if: always()
        continue-on-error: true
        run: |
          mkdir -p "$CLARIFY_EVIDENCE/metadata"
          { uname -sr; echo "cpus: $(nproc)"; free -m; df -h "$RUNNER_TEMP" "$GITHUB_WORKSPACE"; } > "$CLARIFY_EVIDENCE/metadata/runner-facts.txt"

      - name: Install npm workspaces (npm ci)
        id: npm
        uses: ./.github/actions/retry
        with:
          command: npm ci

      - name: Build the Desktop app from source
        id: build
        working-directory: apps/desktop
        timeout-minutes: 15
        run: npm run build

      # The compute-host relay's own Python tests, including the real-child ones that are POSIX-only: Windows skips
      # them, so no other job runs them. The glob is the file naming, so a later test for it is picked up.
      - name: Compute-host clarify draft Python tests (including the POSIX-only real-child tests)
        id: python
        if: always() && steps.pm.outcome == 'success'
        timeout-minutes: 10
        env:
          HERMES_TEST_FILE_RETRIES: '0'
        run: |
          set -euo pipefail
          mkdir -p "$CLARIFY_EVIDENCE/python"
          shopt -s nullglob
          tests=(tests/tui_gateway/test_compute_host*clarify*draft*.py)
          test "${#tests[@]}" -gt 0
          printf 'python test file: %s\n' "${tests[@]}"
          scripts/run_tests.sh "${tests[@]}" -q 2>&1 | tee "$CLARIFY_EVIDENCE/python/run_tests.log"

      # Electron needs a display; xvfb-run supplies one. The hosted image carries Xvfb; this only fills a gap.
      - name: Make sure Xvfb is available
        id: xvfb
        run: |
          set -euo pipefail
          command -v xvfb-run >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends xvfb; }
          command -v xvfb-run

      # The sentinels are the Linux homes of the Windows ones: the default Hermes home, the per-OS-user gateway
      # rendezvous (~/.local/state/hermes*) and Electron's default user data (~/.config/Hermes*).
      - name: Isolation preflight and evidence staging
        id: preflight
        if: always() && steps.build.outcome == 'success'
        run: |
          set -euo pipefail
          python3 -S scripts/clarify_ci/evidence.py guard --spec "apps/desktop/e2e/$COMPUTE_HOST_SPEC"
          python3 -S scripts/clarify_ci/evidence.py sentinels --out "$CLARIFY_EVIDENCE/isolation/before.json" \
            --watch 'HOME/.config/Hermes*'
          python3 -S scripts/clarify_ci/evidence.py stage "$CLARIFY_EVIDENCE/native"

      # One worker, --retries=0, and a skip is a failure (evidence.py verify refuses one): this is the only job that
      # can show the compute-host path works, so it may not pass by not running.
      - name: Native Linux Playwright - clarify drafts through a compute-host child
        id: native
        if: always() && steps.preflight.outcome == 'success' && steps.xvfb.outcome == 'success'
        working-directory: apps/desktop
        timeout-minutes: 15
        env:
          CI: 'true'
          HERMES_DESKTOP_PYTHON: ${{ steps.pm.outputs.python-path }}
          HERMES_E2E_EVIDENCE_DIR: ${{ env.CLARIFY_EVIDENCE }}/native
        run: |
          set -euo pipefail
          "$HERMES_DESKTOP_PYTHON" -S -c "import sys; print('backend interpreter:', sys.executable)"
          test -f "e2e/$COMPUTE_HOST_SPEC"
          xvfb-run -a npx --no playwright test "e2e/$COMPUTE_HOST_SPEC" --workers=1 --retries=0

      - name: No real-install location was touched
        id: isolation
        if: always() && steps.preflight.outcome == 'success'
        run: |
          set -euo pipefail
          python3 -S scripts/clarify_ci/evidence.py sentinels --out "$CLARIFY_EVIDENCE/isolation/after.json" \
            --watch 'HOME/.config/Hermes*'
          python3 -S scripts/clarify_ci/evidence.py isolation --label compute-host \
            --before "$CLARIFY_EVIDENCE/isolation/before.json" --after "$CLARIFY_EVIDENCE/isolation/after.json"

      - name: Verify compute-host evidence is complete
        id: verify
        if: always() && steps.preflight.outcome == 'success'
        run: |
          python3 -S scripts/clarify_ci/evidence.py verify --label compute-host \
            --spec "$COMPUTE_HOST_SPEC" \
            --evidence "$CLARIFY_EVIDENCE/native" \
            --results apps/desktop/playwright-report/results.json \
            --out "$CLARIFY_EVIDENCE/native-verdict.json"

      - name: Collect bounded evidence
        if: always()
        run: |
          python3 -S scripts/clarify_ci/evidence.py collect --dest "$CLARIFY_ARTIFACT" \
            --source "evidence=$CLARIFY_EVIDENCE" \
            --source "playwright-results=apps/desktop/playwright-report/results.json" \
            --source "test-results=apps/desktop/test-results"

      - name: Upload evidence artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: clarify-linux-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.CLARIFY_ARTIFACT }}
          retention-days: 7
          if-no-files-found: error
          include-hidden-files: false

      - name: Evidence gate and summary
        if: always()
        run: |
          python3 -S scripts/clarify_ci/evidence.py gate \
            --title "Clarify drafts: Linux compute-host native evidence" \
            --note "Linux (ubuntu-24.04 x64) evidence for the compute-host child only, built from source. It is not Windows evidence and not a packaged or signed release." \
            --verify "$CLARIFY_EVIDENCE/native-verdict.json" \
            --outcome "setup-pm=${{ steps.pm.outcome }}" \
            --outcome "npm-ci=${{ steps.npm.outcome }}" \
            --outcome "desktop-build=${{ steps.build.outcome }}" \
            --outcome "python-tests=${{ steps.python.outcome }}" \
            --outcome "xvfb=${{ steps.xvfb.outcome }}" \
            --outcome "isolation-preflight=${{ steps.preflight.outcome }}" \
            --outcome "native-e2e=${{ steps.native.outcome }}" \
            --outcome "isolation-after=${{ steps.isolation.outcome }}" \
            --outcome "native-evidence=${{ steps.verify.outcome }}"

  package:
    name: Unsigned Windows candidate package (windows-2025 x64)
    needs: [native, launcher, compute-host]
    if: ${{ inputs.stage != 'native' }}
    runs-on: windows-2025
    timeout-minutes: 60
    outputs:
      package: ${{ steps.manifest.outputs.package }}
      zip_name: ${{ steps.manifest.outputs.zip_name }}
      zip_sha256: ${{ steps.manifest.outputs.zip_sha256 }}
      exe_sha256: ${{ steps.manifest.outputs.exe_sha256 }}
      artifact: ${{ steps.manifest.outputs.artifact }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Name the roots and the baked runtime defaults
        run: |
          set -euo pipefail
          temp="$RUNNER_TEMP"
          if command -v cygpath >/dev/null; then temp="$(cygpath -m "$RUNNER_TEMP")"; fi
          {
            echo "CLARIFY_EVIDENCE=$temp/clarify-package-evidence"
            echo "CLARIFY_ARTIFACT=$temp/clarify-package-artifact"
            echo "CANDIDATE_OUT=$temp/clarify-candidate"
            # What a start WITHOUT the launcher must not be able to reach: the app gets a data directory of its own
            # and no inherited or registry HERMES_HOME (apps/desktop/BUILDING.md, HERMES_BUNDLE_ENV_JSON).
            echo "HERMES_BUNDLE_ENV_JSON=$(python -S scripts/clarify_ci/candidate.py bundle-env | tr -d '\r')"
          } >> "$GITHUB_ENV"

      - name: Record source and run metadata
        if: always()
        run: python -S scripts/clarify_ci/evidence.py metadata --out "$CLARIFY_EVIDENCE/metadata/run.json" --set "build.variant=bundled"

      # The two build roots are excluded from scanning so the multi-gigabyte build is not rescanned file by file.
      # That is the only Defender setting touched: real-time protection stays on, and the runner is a VM that is
      # discarded when the job ends. runner-facts-*.json record the state Defender was really in.
      - name: Exclude the two build roots from Defender scanning
        shell: pwsh
        run: |
          foreach ($path in @('C:\hsb', $env:RUNNER_TEMP)) {
            try { Add-MpPreference -ExclusionPath $path; Write-Host "Defender scan exclusion added for $path" }
            catch { Write-Host "Defender scan exclusion not applied for $path ($($_.Exception.Message)); continuing" }
          }

      - name: Record runner facts before the build
        continue-on-error: true
        shell: pwsh
        run: ./scripts/clarify_ci/Get-RunnerFacts.ps1 -Out "$env:CLARIFY_EVIDENCE/runner-facts-before.json"

      # The build wants a short path (Windows path limits while packaging) and room for several gigabytes, and a
      # hosted runner's workspace drive is the small one (runner-facts-*.json record the real numbers), so the exact
      # commit is cloned to C:\hsb. The workspace checkout is shallow and clean, and so is the clone.
      - name: Clone the exact commit to a short path on the system drive
        id: clone
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git clone --no-hardlinks --quiet "$GITHUB_WORKSPACE" /c/hsb
          test "$(git -C /c/hsb rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git -C /c/hsb status --porcelain --untracked-files=all)"
          echo "building $GITHUB_SHA from C:\\hsb"

      - name: Restore desktop dependency inputs
        id: build-cache
        uses: ./.github/actions/desktop-build-cache
        with:
          phase: restore
          source: C:/hsb
          work: C:/hsb/.build/desktop-job
          cache: C:/hsb/.cache/desktop-inputs
          producer: desktop

      - name: Prepare the complete desktop build (one-commit bundled variant)
        id: prepare
        working-directory: C:/hsb
        timeout-minutes: 25
        run: |
          set -euo pipefail
          python scripts/bundles/desktop.py --commit "$GITHUB_SHA" --variant bundled --prepare-only \
            --work C:/hsb/.build/desktop-job --cache C:/hsb/.cache/desktop-inputs
          python -m scripts.ci.desktop_commands C:/hsb/.build/desktop-job/prepared.json

      # Before the build, so a build that runs out of time still leaves a warm cache for the next dispatch.
      - name: Save dependency inputs before building
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        uses: ./.github/actions/desktop-build-cache
        with:
          phase: save
          source: C:/hsb
          work: C:/hsb/.build/desktop-job
          cache: C:/hsb/.cache/desktop-inputs
          producer: desktop
          key: ${{ steps.build-cache.outputs.cache-key }}

      # The builder gets the prepared inputs only; electron-builder is told --publish never explicitly (the driver
      # adds it too). The signing variables are blank on purpose: the output is unsigned and says so.
      - name: Build the unsigned Windows app (electron-builder, publishing never)
        id: build
        working-directory: C:/hsb
        timeout-minutes: 30
        env:
          AZURE_SIGN_ENDPOINT: ''
          AZURE_SIGN_ACCOUNT: ''
          AZURE_SIGN_PROFILE: ''
          AZURE_SIGN_PUBLISHER: ''
          AZURE_CLIENT_ID: ''
          AZURE_TENANT_ID: ''
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          set -euo pipefail
          python scripts/bundles/desktop.py --prepared C:/hsb/.build/desktop-job/prepared.json --variant bundled -- --publish never

      - name: Locate the unpacked app
        id: locate
        run: python -S scripts/clarify_ci/candidate.py locate --release-dir C:/hsb/apps/desktop/release --commit "$GITHUB_SHA" --github-output

      - name: Record runner facts after the build
        if: always()
        continue-on-error: true
        shell: pwsh
        run: ./scripts/clarify_ci/Get-RunnerFacts.ps1 -Out "$env:CLARIFY_EVIDENCE/runner-facts-after.json"

      - name: Record the executable's Authenticode state
        id: authenticode
        shell: pwsh
        env:
          UNPACKED: ${{ steps.locate.outputs.unpacked }}
        run: |
          $exe = Join-Path $env:UNPACKED ('hermes-' + $env:GITHUB_SHA.Substring(0, 7) + '.exe')
          $signature = Get-AuthenticodeSignature -LiteralPath $exe
          $subject = if ($signature.SignerCertificate) { $signature.SignerCertificate.Subject } else { $null }
          $record = [ordered]@{ status = [string]$signature.Status; subject = $subject }
          New-Item -ItemType Directory -Force -Path $env:CLARIFY_EVIDENCE | Out-Null
          $record | ConvertTo-Json | Set-Content -LiteralPath (Join-Path $env:CLARIFY_EVIDENCE 'authenticode.json') -Encoding UTF8
          $record | ConvertTo-Json

      # Reads app.asar's package.json too: the product name must be this commit's own ("Hermes Agent <sha7>"), never
      # "Hermes", because Electron derives its default user data folder from it.
      - name: Audit the unpacked app is the bundled one-commit build
        id: audit
        env:
          UNPACKED: ${{ steps.locate.outputs.unpacked }}
        run: |
          python -S scripts/clarify_ci/candidate.py audit --app "$UNPACKED" --commit "$GITHUB_SHA" \
            --authenticode "$CLARIFY_EVIDENCE/authenticode.json" --out "$CLARIFY_EVIDENCE/candidate-audit.json"

      - name: Assemble the candidate zip, MANIFEST.json and SHA256SUMS.txt
        id: assemble
        env:
          UNPACKED: ${{ steps.locate.outputs.unpacked }}
        run: |
          python -S scripts/clarify_ci/candidate.py assemble --app "$UNPACKED" --commit "$GITHUB_SHA" \
            --template scripts/clarify_ci/candidate-package --out-dir "$CANDIDATE_OUT" --max-zip-mb 3072 \
            --provenance source-provenance.json --authenticode "$CLARIFY_EVIDENCE/authenticode.json"
          ls -l "$CANDIDATE_OUT"

      - name: Read back what was assembled
        id: manifest
        run: python -S scripts/clarify_ci/candidate.py outputs --manifest "$CANDIDATE_OUT/MANIFEST.json"

      # The zip is already deflated, so the artifact container stores it as is (compression-level 0).
      - name: Upload the candidate (zip, MANIFEST.json, SHA256SUMS.txt)
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.manifest.outputs.artifact }}
          path: ${{ env.CANDIDATE_OUT }}
          retention-days: 7
          compression-level: 0
          if-no-files-found: error
          include-hidden-files: false

      - name: Collect bounded package evidence
        if: always()
        run: |
          python -S scripts/clarify_ci/evidence.py collect --dest "$CLARIFY_ARTIFACT" \
            --source "evidence=$CLARIFY_EVIDENCE" \
            --source "prepared-request=C:/hsb/.build/desktop-job/prepared.json" \
            --source "manifest=$CANDIDATE_OUT/MANIFEST.json" \
            --source "sha256sums=$CANDIDATE_OUT/SHA256SUMS.txt"

      - name: Upload package evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: clarify-package-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.CLARIFY_ARTIFACT }}
          retention-days: 7
          if-no-files-found: error
          include-hidden-files: false

      - name: Package gate and summary
        if: always()
        env:
          ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
          ZIP_NAME: ${{ steps.manifest.outputs.zip_name }}
          ZIP_SHA256: ${{ steps.manifest.outputs.zip_sha256 }}
        run: |
          python -S scripts/clarify_ci/evidence.py gate \
            --title "Clarify drafts: unsigned Windows candidate package" \
            --note "Unsigned, private, never published: ${ZIP_NAME:-no archive} sha256 ${ZIP_SHA256:-none} (artifact digest ${ARTIFACT_DIGEST:-none}). Acceptance of these bytes is the next job." \
            --verify "$CLARIFY_EVIDENCE/candidate-audit.json" \
            --outcome "clone=${{ steps.clone.outcome }}" \
            --outcome "prepare=${{ steps.prepare.outcome }}" \
            --outcome "build=${{ steps.build.outcome }}" \
            --outcome "locate=${{ steps.locate.outcome }}" \
            --outcome "authenticode=${{ steps.authenticode.outcome }}" \
            --outcome "audit=${{ steps.audit.outcome }}" \
            --outcome "assemble=${{ steps.assemble.outcome }}" \
            --outcome "upload=${{ steps.upload.outcome }}"

  accept:
    name: Packaged-bytes acceptance (windows-2025 x64)
    needs: [package]
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Name the roots
        env:
          PACKAGE: ${{ needs.package.outputs.package }}
        run: |
          set -euo pipefail
          temp="$RUNNER_TEMP"
          if command -v cygpath >/dev/null; then temp="$(cygpath -m "$RUNNER_TEMP")"; fi
          {
            echo "CLARIFY_EVIDENCE=$temp/clarify-acceptance-evidence"
            echo "CLARIFY_ARTIFACT=$temp/clarify-acceptance-artifact"
            echo "CANDIDATE_IN=$temp/clarify-candidate-download"
            # A short extraction path: the packaged runtime has deep directory trees.
            echo "CANDIDATE_EXTRACT=C:/hsa"
            echo "CANDIDATE_DIR=C:/hsa/$PACKAGE"
            echo "DECOY_HOME=$temp/decoy-hermes-home"
          } >> "$GITHUB_ENV"

      - name: Record source and run metadata
        if: always()
        run: python -S scripts/clarify_ci/evidence.py metadata --out "$CLARIFY_EVIDENCE/metadata/run.json" --set "package=${{ needs.package.outputs.package }}"

      # Defender is untouched here (neither disabled nor given exclusions), as on a person's machine: extraction and
      # the first start are slower, and a quarantine of anything in the payload would be a real finding.
      - name: Record runner facts
        continue-on-error: true
        shell: pwsh
        run: ./scripts/clarify_ci/Get-RunnerFacts.ps1 -Out "$env:CLARIFY_EVIDENCE/runner-facts.json"

      # Node and npm only: the packaged executable brings its own Python and Electron, and nothing of the locked
      # Python test environment exists here for the candidate to find.
      - name: Prepare locked Node toolchain
        id: pm
        uses: ./.github/actions/setup-pm
        with:
          toolchain: node
          archive-inputs: 'false'

      # The harness never launches a dev Electron, so its binary is not downloaded (the dev fixtures are unused).
      - name: Install npm workspaces (npm ci)
        id: npm
        uses: ./.github/actions/retry
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        with:
          command: npm ci

      - name: Download the candidate artifact
        id: download
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.package.outputs.artifact }}
          path: ${{ env.CANDIDATE_IN }}

      # The archive's digest must equal the one the BUILD job reported through a different route than the artifact,
      # every file must equal MANIFEST.json's list, and the commit must be the one this run is for.
      - name: Verify the downloaded archive against its manifest and extract it
        id: verify-package
        env:
          ZIP_NAME: ${{ needs.package.outputs.zip_name }}
          ZIP_SHA256: ${{ needs.package.outputs.zip_sha256 }}
        run: |
          set -euo pipefail
          mkdir -p "$CLARIFY_EVIDENCE"
          python -S scripts/clarify_ci/candidate.py verify \
            --zip "$CANDIDATE_IN/$ZIP_NAME" --manifest "$CANDIDATE_IN/MANIFEST.json" \
            --extract-to "$CANDIDATE_EXTRACT" --commit "$GITHUB_SHA" --expect-sha256 "$ZIP_SHA256" \
            --out "$CLARIFY_EVIDENCE/archive-verify.json"

      # ---- Run 1: the executable inside the extracted zip, started through the shipped Start-HermesClarifyCandidate.cmd.
      # Beyond the built-in real-install locations (default homes, the installed app's user data and updater cache, the
      # hermes:// registry keys, the per-OS-user gateway rendezvous USERPROFILE/.local/state/hermes*) every Hermes*
      # folder of the real profile is watched. Only the launcher's own sandbox root may appear.
      - name: Isolation preflight and evidence staging (launcher run)
        id: launcher-preflight
        if: always() && steps.verify-package.outcome == 'success'
        run: |
          set -euo pipefail
          python -S scripts/clarify_ci/evidence.py sentinels --out "$CLARIFY_EVIDENCE/isolation/launcher-before.json" \
            --informational LOCALAPPDATA/HermesClarifyCandidate \
            --watch 'APPDATA/Hermes*' --watch 'LOCALAPPDATA/hermes-*' --watch 'USERPROFILE/.hermes*'
          python -S scripts/clarify_ci/evidence.py stage "$CLARIFY_EVIDENCE/packaged"

      # The decoy variables below, if they reached the candidate, would point it at this checkout, another Python or a
      # different Hermes home; the spec proves they did not, and that the decoy home was never created. Each run
      # keeps its own JSON report and output folder: the next run would overwrite them.
      - name: Packaged Playwright (launcher run) - the candidate keeps clarify drafts through a real timeout
        id: launcher-e2e
        if: always() && steps.launcher-preflight.outcome == 'success' && steps.npm.outcome == 'success'
        working-directory: apps/desktop
        timeout-minutes: 30
        env:
          CI: 'true'
          HERMES_E2E_REQUIRE_PACKAGED: '1'
          HERMES_E2E_CANDIDATE_DIR: ${{ env.CANDIDATE_DIR }}
          HERMES_E2E_EXPECT_COMMIT: ${{ github.sha }}
          HERMES_E2E_EVIDENCE_DIR: ${{ env.CLARIFY_EVIDENCE }}/packaged
          HERMES_E2E_DECOY_VARIABLES: HERMES_DESKTOP_HERMES_ROOT,HERMES_DESKTOP_PYTHON,PYTHONPATH
          HERMES_E2E_DECOY_HOME: ${{ env.DECOY_HOME }}
          HERMES_HOME: ${{ env.DECOY_HOME }}
          HERMES_DESKTOP_HERMES_ROOT: ${{ github.workspace }}
          HERMES_DESKTOP_PYTHON: python
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set -euo pipefail
          test -f "$CANDIDATE_DIR/MANIFEST.json"
          rm -f playwright-report/results.json
          status=0
          npx --no playwright test e2e/clarify-drafts-packaged.spec.ts --workers=1 --retries=0 \
            --output=test-results/launcher || status=$?
          cp playwright-report/results.json "$CLARIFY_EVIDENCE/results-launcher.json" || echo "::warning::Playwright wrote no JSON report"
          exit "$status"

      # The safety net: the gateway the app starts outlives it, and a failed run may not have reached the spec's own
      # stop. The same shipped script, started the way its .cmd starts it; with nothing running it must still exit 0.
      - name: Stop the candidate and its background gateway (launcher run)
        id: launcher-stop
        if: always() && steps.verify-package.outcome == 'success'
        shell: powershell
        run: |
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File (Join-Path $env:CANDIDATE_DIR 'launcher\Stop-HermesClarifyCandidate.ps1')
          exit $LASTEXITCODE

      - name: No real-install location was touched (launcher run)
        id: launcher-isolation
        if: always() && steps.launcher-preflight.outcome == 'success'
        run: |
          set -euo pipefail
          python -S scripts/clarify_ci/evidence.py sentinels --out "$CLARIFY_EVIDENCE/isolation/launcher-after.json" \
            --informational LOCALAPPDATA/HermesClarifyCandidate \
            --watch 'APPDATA/Hermes*' --watch 'LOCALAPPDATA/hermes-*' --watch 'USERPROFILE/.hermes*'
          python -S scripts/clarify_ci/evidence.py isolation --label launcher \
            --before "$CLARIFY_EVIDENCE/isolation/launcher-before.json" \
            --after "$CLARIFY_EVIDENCE/isolation/launcher-after.json"

      - name: Verify launcher-run evidence is complete
        id: launcher-evidence
        if: always() && steps.launcher-preflight.outcome == 'success'
        run: |
          python -S scripts/clarify_ci/evidence.py verify --label launcher \
            --spec clarify-drafts-packaged.spec.ts \
            --evidence "$CLARIFY_EVIDENCE/packaged" \
            --results "$CLARIFY_EVIDENCE/results-launcher.json" \
            --expect-observation "packaged:completed=true" \
            --expect-observation "packaged:identity.commit=$GITHUB_SHA" \
            --expect-observation "packaged:identity.isPackaged=true" \
            --expect-observation "packaged:identity.execPathIsPackagedExe=true" \
            --expect-observation "packaged:identity.exeSha256Matches=true" \
            --expect-observation "packaged:identity.nameIsCandidate=true" \
            --expect-observation "packaged:identity.bakedHermesHomeClearActive=true" \
            --expect-observation "packaged:isolation.contractProblems=0" \
            --expect-observation "packaged:isolation.userDataIsSandbox=true" \
            --expect-observation "packaged:isolation.hermesHomeIsSandbox=true" \
            --expect-observation "packaged:isolation.agentWorkingDirectoryIsWorkspace=true" \
            --expect-observation "packaged:isolation.decoyHomeUntouched=true" \
            --expect-observation "packaged:backend.executableInsidePayload=true" \
            --expect-observation "packaged:backend.foreignProcesses=0" \
            --expect-observation "packaged:backend.rendezvousInsideSandbox=true" \
            --expect-observation "packaged:scenario.serverConfirmedSave=true" \
            --expect-observation "packaged:scenario.draftsAreNotAnswers=true" \
            --expect-observation "packaged:scenario.recalledFromServer=true" \
            --expect-observation "packaged:scenario.modelToldUnsubmitted=true" \
            --expect-observation "packaged:teardown.stopExitCode=0" \
            --expect-observation "packaged:teardown.processesLeft=0" \
            --out "$CLARIFY_EVIDENCE/launcher-verdict.json"

      # ---- Run 2: the same executable started DIRECTLY, with no launcher and no isolation switch, the way a
      # double-click starts it (a decoy HERMES_HOME exported on purpose; none of the dev decoys). What a person's
      # machine may see is the candidate's own names: an empty HermesBundledCommit<sha7> and its suffixed twin in
      # %APPDATA%, hermes-clarify-candidate in %LOCALAPPDATA%. Those two patterns are reported, not gated; everything
      # else is: the exact installed-app names, the hermes:// registry keys, .hermes*, and the per-user gateway
      # rendezvous (.local/state/hermes*). A commit build keeps its rendezvous in its own home
      # (electron/backend-spawn-env.ts), so any hit there is a failure.
      - name: Isolation preflight and evidence staging (direct run)
        id: direct-preflight
        if: always() && steps.verify-package.outcome == 'success'
        run: |
          set -euo pipefail
          python -S scripts/clarify_ci/evidence.py sentinels --out "$CLARIFY_EVIDENCE/isolation/direct-before.json" \
            --informational 'APPDATA/Hermes*' --informational 'LOCALAPPDATA/hermes*' --watch 'USERPROFILE/.hermes*'
          python -S scripts/clarify_ci/evidence.py stage "$CLARIFY_EVIDENCE/packaged-direct"

      - name: Packaged Playwright (direct run) - started without its launcher
        id: direct-e2e
        if: always() && steps.direct-preflight.outcome == 'success' && steps.npm.outcome == 'success'
        working-directory: apps/desktop
        timeout-minutes: 15
        env:
          CI: 'true'
          HERMES_E2E_REQUIRE_PACKAGED: '1'
          HERMES_E2E_CANDIDATE_DIR: ${{ env.CANDIDATE_DIR }}
          HERMES_E2E_EXPECT_COMMIT: ${{ github.sha }}
          HERMES_E2E_EVIDENCE_DIR: ${{ env.CLARIFY_EVIDENCE }}/packaged-direct
          HERMES_E2E_DECOY_HOME: ${{ env.DECOY_HOME }}
          HERMES_HOME: ${{ env.DECOY_HOME }}
        run: |
          set -euo pipefail
          test -f "$CANDIDATE_DIR/MANIFEST.json"
          rm -f playwright-report/results.json
          status=0
          npx --no playwright test e2e/clarify-drafts-packaged-direct.spec.ts --workers=1 --retries=0 \
            --output=test-results/direct || status=$?
          cp playwright-report/results.json "$CLARIFY_EVIDENCE/results-direct.json" || echo "::warning::Playwright wrote no JSON report"
          exit "$status"

      - name: Stop the candidate and its background gateway (direct run)
        id: direct-stop
        if: always() && steps.verify-package.outcome == 'success'
        shell: powershell
        run: |
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File (Join-Path $env:CANDIDATE_DIR 'launcher\Stop-HermesClarifyCandidate.ps1')
          exit $LASTEXITCODE

      - name: No real-install location was touched (direct run)
        id: direct-isolation
        if: always() && steps.direct-preflight.outcome == 'success'
        run: |
          set -euo pipefail
          python -S scripts/clarify_ci/evidence.py sentinels --out "$CLARIFY_EVIDENCE/isolation/direct-after.json" \
            --informational 'APPDATA/Hermes*' --informational 'LOCALAPPDATA/hermes*' --watch 'USERPROFILE/.hermes*'
          python -S scripts/clarify_ci/evidence.py isolation --label direct \
            --before "$CLARIFY_EVIDENCE/isolation/direct-before.json" \
            --after "$CLARIFY_EVIDENCE/isolation/direct-after.json"

      - name: Verify direct-run evidence is complete
        id: direct-evidence
        if: always() && steps.direct-preflight.outcome == 'success'
        run: |
          python -S scripts/clarify_ci/evidence.py verify --label direct \
            --spec clarify-drafts-packaged-direct.spec.ts \
            --evidence "$CLARIFY_EVIDENCE/packaged-direct" \
            --results "$CLARIFY_EVIDENCE/results-direct.json" \
            --expect-observation "packaged-direct:completed=true" \
            --expect-observation "packaged-direct:identity.commit=$GITHUB_SHA" \
            --expect-observation "packaged-direct:identity.isPackaged=true" \
            --expect-observation "packaged-direct:identity.execPathIsPackagedExe=true" \
            --expect-observation "packaged-direct:identity.exeSha256Matches=true" \
            --expect-observation "packaged-direct:identity.nameIsCandidate=true" \
            --expect-observation "packaged-direct:identity.userDataIsCandidateOwn=true" \
            --expect-observation "packaged-direct:identity.hermesHomeIsCandidateOwn=true" \
            --expect-observation "packaged-direct:identity.bakedHermesHomeClearActive=true" \
            --expect-observation "packaged-direct:backend.executableInsidePayload=true" \
            --expect-observation "packaged-direct:deeplink.registrationSkippedForCommitBuild=true" \
            --expect-observation "packaged-direct:isolation.decoyHomeUntouched=true" \
            --expect-observation "packaged-direct:isolation.unexpectedRealProfileEntries=0" \
            --expect-observation "packaged-direct:rendezvous.perUserRecordCount=0" \
            --expect-observation "packaged-direct:teardown.stopExitCode=0" \
            --expect-observation "packaged-direct:teardown.processesLeft=0" \
            --out "$CLARIFY_EVIDENCE/direct-verdict.json"

      - name: Acceptance verdict for exactly these bytes
        id: verdict
        if: always() && steps.verify-package.outcome == 'success'
        run: |
          python -S scripts/clarify_ci/candidate.py verdict \
            --manifest "$CANDIDATE_IN/MANIFEST.json" \
            --archive-verify "$CLARIFY_EVIDENCE/archive-verify.json" \
            --evidence-verdict "launcher=$CLARIFY_EVIDENCE/launcher-verdict.json" \
            --evidence-verdict "direct=$CLARIFY_EVIDENCE/direct-verdict.json" \
            --outcome "launcher-e2e=${{ steps.launcher-e2e.outcome }}" \
            --outcome "launcher-stop=${{ steps.launcher-stop.outcome }}" \
            --outcome "launcher-isolation=${{ steps.launcher-isolation.outcome }}" \
            --outcome "launcher-evidence=${{ steps.launcher-evidence.outcome }}" \
            --outcome "direct-e2e=${{ steps.direct-e2e.outcome }}" \
            --outcome "direct-stop=${{ steps.direct-stop.outcome }}" \
            --outcome "direct-isolation=${{ steps.direct-isolation.outcome }}" \
            --outcome "direct-evidence=${{ steps.direct-evidence.outcome }}" \
            --out "$CLARIFY_EVIDENCE/acceptance-verdict.json"

      - name: Collect bounded evidence
        if: always()
        run: |
          python -S scripts/clarify_ci/evidence.py collect --dest "$CLARIFY_ARTIFACT" \
            --source "evidence=$CLARIFY_EVIDENCE" \
            --source "test-results=apps/desktop/test-results" \
            --source "manifest=$CANDIDATE_IN/MANIFEST.json"

      - name: Upload acceptance evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: clarify-acceptance-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.CLARIFY_ARTIFACT }}
          retention-days: 7
          if-no-files-found: error
          include-hidden-files: false

      - name: Acceptance gate and summary
        if: always()
        env:
          ZIP_NAME: ${{ needs.package.outputs.zip_name }}
          ZIP_SHA256: ${{ needs.package.outputs.zip_sha256 }}
        run: |
          python -S scripts/clarify_ci/evidence.py gate \
            --title "Clarify drafts: packaged-bytes acceptance (unsigned Windows candidate)" \
            --note "Acceptance of ${ZIP_NAME:-no archive} sha256 ${ZIP_SHA256:-none}, extracted from the uploaded artifact on a clean GitHub-hosted windows-2025 x64 runner, run through its shipped launcher and started directly. Unsigned, private, never published. It does not show the candidate works on any other machine, with a real provider or server, or beside an installed Hermes." \
            --verify "$CLARIFY_EVIDENCE/acceptance-verdict.json" \
            --outcome "setup-node=${{ steps.pm.outcome }}" \
            --outcome "npm-ci=${{ steps.npm.outcome }}" \
            --outcome "download=${{ steps.download.outcome }}" \
            --outcome "verify-package=${{ steps.verify-package.outcome }}" \
            --outcome "launcher-preflight=${{ steps.launcher-preflight.outcome }}" \
            --outcome "launcher-e2e=${{ steps.launcher-e2e.outcome }}" \
            --outcome "launcher-stop=${{ steps.launcher-stop.outcome }}" \
            --outcome "launcher-isolation=${{ steps.launcher-isolation.outcome }}" \
            --outcome "launcher-evidence=${{ steps.launcher-evidence.outcome }}" \
            --outcome "direct-preflight=${{ steps.direct-preflight.outcome }}" \
            --outcome "direct-e2e=${{ steps.direct-e2e.outcome }}" \
            --outcome "direct-stop=${{ steps.direct-stop.outcome }}" \
            --outcome "direct-isolation=${{ steps.direct-isolation.outcome }}" \
            --outcome "direct-evidence=${{ steps.direct-evidence.outcome }}" \
            --outcome "acceptance-verdict=${{ steps.verdict.outcome }}"
